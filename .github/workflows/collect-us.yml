name: collect-us
on:
  schedule:
    - cron: '0 22 * * 1-5'
    - cron: '20 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: collect
        env:
          KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV:        prod
        run: mkdir -p data && PYTHONPATH=scripts python scripts/collect_us.py
      - name: commit
        run: |
          git config user.name  "kis-bot"
          git config user.email "kis-bot@users.noreply.github.com"
          git add -A data || true
          git diff --staged --quiet || git commit -m "us $(TZ=Asia/Seoul date +%F\ %H:%M)"
          git push
