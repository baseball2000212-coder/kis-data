name: collect-kr
on:
  schedule:
    - cron: '55 3 * * 1-5'    # 12:55 KST — 장중 파생 카드용(13:00 제작)
    - cron: '50 6 * * 1-5'    # 15:50 KST — 장 마감 직후
    - cron: '5 7 * * 1-5'     # 16:05 KST — 확정치 재수집
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: KST 날짜 (토큰 캐시 키)
        id: d
        run: echo "day=$(TZ=Asia/Seoul date +%F)" >> $GITHUB_OUTPUT
      - name: 접근토큰 캐시
        uses: actions/cache@v4
        with:
          path: .tokencache
          key: kis-token-${{ steps.d.outputs.day }}
      - name: collect
        working-directory: .
        env:
          KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV:        prod
          KR_FUT_CODE:    ${{ vars.KR_FUT_CODE }}
        run: mkdir -p data && PYTHONPATH=scripts python scripts/collect_kr.py
      - name: commit
        run: |
          git config user.name  "kis-bot"
          git config user.email "kis-bot@users.noreply.github.com"
          git add -A data || true
          git diff --staged --quiet || git commit -m "kr $(TZ=Asia/Seoul date +%F\ %H:%M)"
          git push
